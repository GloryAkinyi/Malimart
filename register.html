<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page - MaliMart</title>

    <link rel="stylesheet" href="css/register.css">


</head>
<body>
    


    <form action="">

        <legend>Join Us Today!</legend>
        <br>


        <label for="fullname">Fullname : </label>
        <input type="text" id="fullname" placeholder="e.g Mark Doe" required>
        <br><br>



        <label for="email">Email Address : </label>
        <input type="email" id="email" placeholder="e.g abc@gmail.com" required>
        <br><br>


        <label for="pwd">Password : </label>
        <input type="password" id="pwd" placeholder="Type your password" required>
        <br><br>


        <label for="phone">Phone Number : </label>
        <input type="tel" id="phone" placeholder="0724567890" required>
        <br><br>


        <label for="dob">Birthday : </label>
        <input type="date" id="dob" required>
        <br><br>


        <label for="dt">Date and Time : </label>
        <input type="datetime-local" id="dt" required>
        <br><br>


        <label for="upload">Upload File : </label>
        <input type="file" id="upload" required>
        <br><br>


        <!--Dropdown-->


        <!--RadioButton-->


        <!---Checkbox-->

        <!---Textarea-->


        <button>Register</button>











    </form>












</body>
</html>
